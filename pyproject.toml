[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo2prompt"
version = "0.4.0"
description = "Create LLM-ready repository prompts with dependency maps, symbol signatures, .gitignore support, and language detection."
authors = [{ name = "Mikhail Kuznetsov", email = "mmkuznecov2002@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["repository", "llm", "prompt", "gitignore", "cli"]
dependencies = [
    "pathspec>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/mmkuznecov/repo2prompt"

[project.scripts]
repo2prompt = "repo2prompt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
